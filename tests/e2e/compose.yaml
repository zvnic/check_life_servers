name: cls-device-e2e

services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: cls_e2e
      POSTGRES_USER: cls_e2e
      POSTGRES_PASSWORD: cls_e2e_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cls_e2e -d cls_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [monitor]

  api:
    build:
      context: ../..
    environment:
      DATABASE_URL: postgresql+psycopg://cls_e2e:cls_e2e_only@db:5432/cls_e2e
      CLS_PUBLIC_URL: http://frontend:8080
      ENROLLMENT_TTL_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [monitor]

  frontend:
    build:
      context: ../../frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      monitor:
        ipv4_address: 10.253.247.10

  ubuntu-device:
    build:
      context: ../..
      dockerfile: tests/e2e/devices/Dockerfile.ubuntu
    hostname: e2e-ubuntu
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks: [monitor]

  openwrt-device:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: tests/e2e/devices/Dockerfile.openwrt
    hostname: e2e-openwrt
    privileged: true
    networks:
      monitor:
        ipv4_address: 10.253.247.20

networks:
  monitor:
    ipam:
      config:
        - subnet: 10.253.247.0/24
